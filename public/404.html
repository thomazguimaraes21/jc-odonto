<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada | JC Odonto</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #0077B6; --ink: #171717; --muted: #606060; }
    body { margin:0; font-family:"Inter",Arial,sans-serif; color:var(--ink); background:#fff; }
    main { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:1.5rem; }
    .code { font-size:clamp(4rem,12vw,7rem); font-weight:800; color:var(--brand); line-height:1; margin:0; }
    h1 { font-size:1.5rem; margin:.5rem 0 0; }
    p { color:var(--muted); max-width:26rem; margin:1rem auto 0; }
    .actions { display:flex; gap:.75rem; justify-content:center; margin-top:2rem; flex-wrap:wrap; }
    a.btn { display:inline-flex; align-items:center; justify-content:center; padding:.9rem 1.75rem; border-radius:6px; text-decoration:none; font-size:.9rem; font-weight:600; }
    .primary { background:var(--brand); color:#fff; }
    .ghost { border:1px solid rgba(23,23,23,.16); color:var(--ink); }
  </style>
</head>
<body>
  <main>
    <div>
      <p class="code">404</p>
      <h1>Essa página não existe</h1>
      <p>O link pode estar errado ou a página foi movida.</p>
      <div class="actions">
        <a class="btn primary" href="/">Voltar ao início</a>
        <a class="btn ghost" href="https://wa.me/5511971313428" target="_blank" rel="noopener">Falar no WhatsApp</a>
      </div>
    </div>
  </main>
</body>
</html>
